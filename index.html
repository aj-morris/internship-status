<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="theme-color" content="#ffffff">
		<meta name="description" content="">
		<title>ZED | Application tracker</title>
		<link rel="stylesheet" href="css/styles.css">
	</head>
	<body>
		<header>
			<h1>ZED application tracker</h1>
			<p>Keep your internship and job applications in one place.</p>
		</header>

		<main id="main-content">
			<section aria-labelledby="form-heading">
				<h2 id="form-heading">Add an application</h2>
				<p>Company and position are required. Applications are saved in this browser.</p>
				<form id="application-form" novalidate>
					<div class="form-grid">
						<div><label for="company">Company (required)</label><input id="company" name="company" required aria-describedby="company-error"><p id="company-error" class="error"></p></div>
						<div><label for="position">Position (required)</label><input id="position" name="position" required aria-describedby="position-error"><p id="position-error" class="error"></p></div>
						<div><label for="link">Application link (optional)</label><input id="link" name="link" type="url" aria-describedby="link-hint link-error"><p id="link-hint" class="hint">Use a full https:// or http:// address.</p><p id="link-error" class="error"></p></div>
						<div><label for="application-date">Application date (optional)</label><input id="application-date" name="applicationDate" type="date" aria-describedby="application-date-error"><p id="application-date-error" class="error"></p></div>
						<div><label for="status">Status</label><select id="status" name="status"> <option>Work in Progress</option><option>Applied</option><option>Interviewing</option><option>Offer</option><option>Rejected</option><option>Withdrawn</option></select></div>
						<div><label for="contact">Contact (optional)</label><input id="contact" name="contact"></div>
						<div><label for="follow-up-date">Follow-up date (optional)</label><input id="follow-up-date" name="followUpDate" type="date" aria-describedby="follow-up-date-error"><p id="follow-up-date-error" class="error"></p></div>
						<div class="full-width"><label for="notes">Notes (optional)</label><textarea id="notes" name="notes" rows="4"></textarea></div>
					</div>
					<button type="submit">Save application</button>
					<p id="form-message" role="status" aria-live="polite"></p>
				</form>
			</section>
			<section aria-labelledby="saved-heading">
				<h2 id="saved-heading">Saved applications</h2>
				<p id="storage-message" role="status"></p>
				<p id="empty-message">No applications saved yet. Add your first application above.</p>
				<ul id="application-list" class="application-list"></ul>
			</section>
		</main>
        <script src="js/app.js" defer></script>
	</body>
</html>
